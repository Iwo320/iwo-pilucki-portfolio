  <body>
    <header><a href="index.html">IWO PIŁUCKI <span>/ PHOTOGRAPHY</span></a><a href="index.html">← Back</a></header>
    <main><p class="kicker">Collection</p><h1></h1><p class="count"></p><div class="collection-grid"></div><p class="empty" hidden>No photos in this collection yet.</p></main>
    <dialog class="lightbox" aria-label="Enlarged photograph">
      <button class="lightbox-close" type="button" aria-label="Close enlarged view">×</button>
      <button class="lightbox-prev" type="button" aria-label="Previous photograph">←</button>
      <figure><img alt="" /><figcaption></figcaption></figure>
      <button class="lightbox-next" type="button" aria-label="Next photograph">→</button>
    </dialog>
