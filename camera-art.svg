<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Graphic illustration of a professional camera</title>
  <desc id="desc">A black professional camera with a large green-tinted lens, shown as an isolated three-dimensional object.</desc>
  <defs>
    <linearGradient id="body" x1="170" y1="205" x2="970" y2="710" gradientUnits="userSpaceOnUse">
