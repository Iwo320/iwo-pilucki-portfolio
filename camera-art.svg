      <stop offset=".42" stop-color="#171918"/>
      <stop offset="1" stop-color="#090a09"/>
    </linearGradient>
    <linearGradient id="top" x1="270" y1="135" x2="850" y2="385" gradientUnits="userSpaceOnUse">
