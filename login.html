<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="login.css" />
    <script src="login.js" defer></script>

  <body>
    <header>
      <a href="index.html">IWO PIŁUCKI <span>/ PHOTOGRAPHY</span></a>
      <div class="header-actions">
        <button class="language" type="button" aria-label="Change language">PL</button>
        <a href="index.html" data-en="← Back to portfolio" data-pl="← Wróć do portfolio">← Back to portfolio</a>
      </div>
    </header>
    <main>
      <p class="kicker" data-en="Private client area" data-pl="Prywatna strefa klienta">Private client area</p>
      <h1 data-en="Welcome<br /><i>back.</i>" data-pl="Witaj<br /><i>ponownie.</i>">Welcome<br /><i>back.</i></h1>

        <label><span data-en="Email" data-pl="E-mail">Email</span><input name="email" type="email" autocomplete="email" required /></label>

      <p class="login-status" aria-live="polite"></p>
      <a class="help-link" href="mailto:iwopilucki@icloud.com" data-en="Need access? Get in touch ↗" data-pl="Potrzebujesz dostępu? Napisz ↗">Need access? Get in touch ↗</a>
    </main>
