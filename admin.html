<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Admin — Iwo Piłucki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="admin.css" />
    <script src="admin.js" defer></script>
  </head>
  <body>
    <header><a href="index.html">IWO PIŁUCKI / ADMIN</a><button class="logout" type="button">Log out</button></header>
    <main>
      <p class="kicker">Private client area</p>
      <h1>Manage<br /><i>collections.</i></h1>
      <section class="uploader" aria-labelledby="upload-title">
        <div><p class="section-number">01</p><h2 id="upload-title">Add photographs</h2></div>
        <form class="upload-form" enctype="multipart/form-data">
          <label>Collection<select name="category"><option value="landscape">Landscape</option><option value="cities">Cities</option><option value="details">Details</option><option value="atmosphere">Atmosphere</option><option value="aviation">Aviation</option></select></label>
          <label>Photos<input name="photos" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple required /></label>
          <label>Description<span class="hint">One description for all photos in this upload (max 500 characters).</span><textarea name="description" rows="3" maxlength="500" placeholder="e.g. Dawn over the runway, October 2026."></textarea></label>
          <button type="submit">Upload photos</button>
          <p class="status" aria-live="polite"></p>
        </form>
      </section>
      <section class="library" aria-labelledby="library-title"><div><p class="section-number">02</p><h2 id="library-title">Current library</h2></div><div class="photo-list"></div></section>
    </main>
  </body>
</html>
